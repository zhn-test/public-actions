name: expr check

on:
  push:
    branches: [ci/expr-check]

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: goldfish
            outcome: pass
          - group: goldfish_fail
            outcome: fail
          - group: ntfc
            outcome: pass
          - group: ntfc_fail
            outcome: fail
    steps:
      - name: Produce a package directory
        run: |
          # matrix.group carries the _fail suffix only to drive this probe; the
          # real workflow has one group name per matrix entry.
          g="${{ matrix.group }}"
          real="${g%_fail}"
          mkdir -p "$real"
          echo "content for $real" > "$real/payload.txt"
          echo "real_group=$real" >> $GITHUB_ENV

      - name: Simulate the build step
        run: |
          if [ "${{ matrix.outcome }}" = "fail" ]; then
            echo "simulating a build/runtime failure"
            exit 1
          fi
          echo "simulating success"

      # Exactly the condition under review, with the probe's real group name.
      - name: Archive CI Build Package
        if: ${{ success() || (!cancelled() && env.real_group == 'ntfc') }}
        uses: actions/upload-artifact@v4
        with:
          name: Build_Package_${{ matrix.group }}
          path: |
            ${{ env.real_group }}
