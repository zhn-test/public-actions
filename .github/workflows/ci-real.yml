# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ci/repro-timedmqueue]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      TRIGGER_REPO_NAME: ${{ steps.set-env.outputs.TRIGGER_REPO_NAME }}
      TRIGGER_COMMIT_ID: ${{ steps.set-env.outputs.TRIGGER_COMMIT_ID }}
      PR_INFO_FILE: ${{ steps.set-env.outputs.PR_INFO_FILE }}
      SNAPSHOT: ${{ steps.set-env.outputs.SNAPSHOT }}
      CURRENT_ACTION_URL: ${{ steps.set-env.outputs.CURRENT_ACTION_URL }}
      ALL_PR: ${{ steps.parse-dependencies.outputs.ALL_PR }}
      DEPENDS_ON: ${{ steps.parse-dependencies.outputs.DEPENDS_ON }}
    steps:
    - name: Set ENV
      id: set-env
      env:
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
          REPO_BASENAME=$(basename "$GITHUB_REPOSITORY")
          echo "TRIGGER_REPO_NAME=$REPO_BASENAME" >> $GITHUB_ENV
          echo "TRIGGER_REPO_NAME=$REPO_BASENAME" >> $GITHUB_OUTPUT
          echo "TRIGGER_COMMIT_ID=$PR_HEAD_SHA" >> $GITHUB_ENV
          echo "TRIGGER_COMMIT_ID=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
          echo "PR_INFO_FILE=pr_info_${REPO_BASENAME}_${PR_NUMBER}" >> $GITHUB_ENV
          echo "PR_INFO_FILE=pr_info_${REPO_BASENAME}_${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "SNAPSHOT=snapshot_${REPO_BASENAME}_${PR_NUMBER}" >> $GITHUB_ENV
          echo "SNAPSHOT=snapshot_${REPO_BASENAME}_${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "CURRENT_ACTION_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_ENV
          echo "CURRENT_ACTION_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_OUTPUT

    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: 3.8

    - name: Get Current Action URL
      run: |
        echo "Current Action URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

    - name: Parse PR Description for Dependencies
      id: parse-dependencies
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_REPO: ${{ github.repository }}
        PR_NUM: ${{ github.event.pull_request.number }}
        CI_PAT: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -x
        printf '%s\n' "$PR_BODY" > pull_request.body.txt

        DEPENDS_ON=$(grep -oP 'depends-on:\s*\[[^]]+\]' pull_request.body.txt | sed 's/^ *//;s/ *$//') || true
        echo "PR DEPENDS_ON: $DEPENDS_ON"
        DEPENDS_ON=$(echo "$DEPENDS_ON" | grep -oP '(?<=\[)[^]]+(?=\])') || true
        DEPENDS_ON=$(echo $DEPENDS_ON | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        DEPENDS_ON=$(echo "$DEPENDS_ON" | awk '{for(i=1;i<=NF;i++) if(!a[$i]++) printf "%s%s",$i,(i==NF?ORS:OFS)}')

        VALIDATED_DEPS=""
        for dep in $DEPENDS_ON; do
          if echo "$dep" | grep -qP '^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+/pull/[0-9]+$'; then
            if [[ "$dep" =~ ^open-vela/ ]]; then
              VALIDATED_DEPS="$VALIDATED_DEPS $dep"
            else
              echo "::error::Cross-organization dependencies are forbidden: $dep"
              exit 1
            fi
          else
            echo "::warning::Ignoring invalid depends-on entry: $dep"
          fi
        done
        DEPENDS_ON=$(echo "$VALIDATED_DEPS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

        ALL_PR="$DEPENDS_ON ${PR_REPO}/pull/${PR_NUM}"
        ALL_PR=$(echo $ALL_PR | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        ALL_PR=$(echo "$ALL_PR" | awk '{for(i=1;i<=NF;i++) if(!a[$i]++) printf "%s%s",$i,(i==NF?ORS:OFS)}')
        manifest_part=$(echo "$ALL_PR" | grep -o 'open-vela/manifests[^ ]*') || true
        if [ "$manifest_part"X != ""X ]; then
          without_manifest_pr=$(echo "$ALL_PR" | sed "s|$manifest_part||" | xargs)
          ALL_PR="$manifest_part $without_manifest_pr"
        fi
        echo "ALL_PR=$ALL_PR" >> $GITHUB_ENV
        echo "ALL_PR=$ALL_PR" >> $GITHUB_OUTPUT
        echo "DEPENDS_ON=$DEPENDS_ON" >> $GITHUB_ENV
        echo "DEPENDS_ON=$DEPENDS_ON" >> $GITHUB_OUTPUT
        echo "$TRIGGER_REPO_NAME:$TRIGGER_COMMIT_ID" >> "$PR_INFO_FILE"

        for DEPENDENCY in $DEPENDS_ON; do
          REPO_NAME=$(echo $DEPENDENCY | awk -F'/pull/' '{print $1}')
          PR_NUMBER=$(echo $DEPENDENCY | awk -F'/pull/' '{print $2}')
          PR_COMMITS=$(curl -s -H "Authorization: token ${CI_PAT}" "https://api.github.com/repos/$REPO_NAME/pulls/$PR_NUMBER")
          LATEST_SHA=$(echo "$PR_COMMITS" | jq -r '.head.sha')
          if [[ -z "$LATEST_SHA" ]]; then
            echo "No commits found for PR #$PR_NUMBER or invalid API response."
            exit 1
          fi
          echo "$REPO_NAME:$LATEST_SHA" >> "$PR_INFO_FILE"
          curl -X POST \
            -H "Authorization: token ${CI_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO_NAME/statuses/$LATEST_SHA" \
            -d '{
              "state": "pending",
              "description": "In progress",
              "context": "CI triggered by other PR",
              "target_url": "'"$CURRENT_ACTION_URL"'"
            }'
          COMMENT_BODY="CI started by ${PR_REPO}/pull/${PR_NUM}.\n PR list is $ALL_PR.\n CI url: $CURRENT_ACTION_URL"
          curl -X POST \
            -H "Authorization: token ${CI_PAT}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO_NAME/issues/$PR_NUMBER/comments" \
            -d "{\"body\": \"$COMMENT_BODY\"}"
        done

    - name: Download and install repo
      run: |
        mkdir ~/bin
        echo 'export PATH=~/bin:$PATH' >> $HOME/.bashrc
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Clean up disk space
      run: |
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /etc/mysql /etc/php /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a
        sudo docker system prune -af
        sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* openjdk* adoptopenjdk* mysql* php* mongodb* moby* snap* || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        df -h

    - name: Verify repo installation
      run: |
        ~/bin/repo --version

    - name: Get PR source branch name
      id: get_branch_name
      run: |
        PR_BRANCH=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")
        echo "branch_name=$PR_BRANCH" >> $GITHUB_OUTPUT

    - name: Repo Init
      env:
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        ~/bin/repo init -u https://github.com/open-vela/manifests -b "$PR_BASE_REF" -m openvela.xml --group=default,platform-linux --depth=1 --git-lfs
        echo "REPO_INIT=true" >> $GITHUB_ENV

    - name: Apply manifest PR before sync
      if: ${{ github.event_name == 'pull_request_target' && github.repository == 'open-vela/manifests' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global user.email "openvela-robot@xiaomi.com"
        git config --global user.name "openvela-robot"
        cd .repo/manifests
        git fetch origin pull/$PR_NUMBER/head:pr-branch
        git cherry-pick $(git rev-list --reverse HEAD..$PR_HEAD_SHA) || true
        cd -

    - name: Repo Sync
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        df -h
        ~/bin/repo sync -c -d --no-tags -j12
        df -h
        pwd && ls -atl .
        ~/bin/repo manifest -r -o "$SNAPSHOT"

    - name: Archive Snapshot and PR Info
      uses: actions/upload-artifact@v4
      with:
        name: source_info
        path: |
          ${{ env.SNAPSHOT }}
          ${{ env.PR_INFO_FILE }}

  # Build tasks in parallel as a matrix
  ci-tasks:
    needs: setup
    runs-on: ubuntu-24.04
    # Only the ntfc groups are bounded here; the others keep GitHub's 360 default.
    timeout-minutes: ${{ startsWith(matrix.group, 'ntfc') && 180 || 360 }}
    env:
      DOCKER_BUILDKIT: 1
    strategy:
      matrix:
        group: [ntfc-armv8a-smp-r1, ntfc-armv8a-smp-r2, ntfc-armv8a-smp-r3, ntfc-armv8a-smp-r4, ntfc-armv8a-smp-r5, ntfc-armv8a-smp-r6, ntfc-armv8a-smp-r7, ntfc-armv8a-smp-r8, ntfc-armv8a-smp-r9, ntfc-armv8a-smp-r10, ntfc-armv8a-smp-r11, ntfc-armv8a-smp-r12, ntfc-armv8a-smp-r13, ntfc-armv8a-smp-r14, ntfc-armv8a-smp-r15, ntfc-armv8a-smp-r16]
        include:
          - group: ntfc-armv8a-smp-r1
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r2
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r3
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r4
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r5
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r6
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r7
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r8
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r9
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r10
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r11
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r12
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r13
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r14
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r15
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
          - group: ntfc-armv8a-smp-r16
            tasks:
              - qemu-armv8a:citest_smp@cmake@ntfc
      fail-fast: false
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 10240
          temp-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Download Snapshot and PR Info
        uses: actions/download-artifact@v4
        with:
          name: source_info
          path: .

      - name: Download and install repo
        run: |
          mkdir ~/bin
          echo 'export PATH=~/bin:$PATH' >> $HOME/.bashrc
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Repo Init
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SNAPSHOT_FILE: ${{ needs.setup.outputs.SNAPSHOT }}
        run: |
          ~/bin/repo init -u https://github.com/open-vela/manifests -b "$PR_BASE_REF" -m openvela.xml --group=default,platform-linux --depth=1 --git-lfs
          # Sync the latest openvela.xml rather than the setup job's pinned
          # snapshot; the snapshot is still copied for the PR-mode lookups.
          cp "$SNAPSHOT_FILE"  .repo/manifests/
          echo "REPO_INIT=true" >> $GITHUB_ENV

      - name: Repo Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          df -h
          ~/bin/repo sync -c -d --no-tags -j12
          echo "=== synced revisions ==="
          ~/bin/repo forall nuttx apps tests -c 'echo "$REPO_PATH $(git rev-parse HEAD)"' || true
          df -h
          pwd && ls -atl .

      - name: Fetch PR
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALL_PR: ${{ needs.setup.outputs.ALL_PR }}
          PR_INFO_FILE: ${{ needs.setup.outputs.PR_INFO_FILE }}
          SNAPSHOT_FILE: ${{ needs.setup.outputs.SNAPSHOT }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          current_path=$(pwd)
          echo "REPO_ROOT=$current_path" >> $GITHUB_ENV
          echo $(ls -atl)
          git config --global user.email "openvela-robot@xiaomi.com"
          git config --global user.name "openvela-robot"
          set -x
          repo_exist=0
          repo_sync_code=0
          fetch_code=0
          cp_code=0
          code_base_check=0
          fetch_log=$current_path/fetch.log
          cp_log=$current_path/cp.log
          for DEPENDENCY in $ALL_PR; do
            REPO_FULL_PATH=$(echo $DEPENDENCY | awk -F'/pull/' '{print $1}')
            PR_NUMBER=$(echo $DEPENDENCY | awk -F'/pull/' '{print $2}')
            PROJECT_NAME=$(echo $REPO_FULL_PATH | cut -d '/' -f 2)
            PR_COMMIT=$(cat "$PR_INFO_FILE" | grep "${PROJECT_NAME}:" | awk -F':' '{print $2}')
            if [ $PROJECT_NAME == "manifests" ]; then
              cd .repo/manifests
              echo "git fetch origin pull/$PR_NUMBER/head:pr-branch"
              fetch_pr_result=$(git fetch origin pull/$PR_NUMBER/head:pr-branch >> $fetch_log 2>&1)
              fetch_pr_code=$?
              if [ $fetch_pr_code -ne 0 ]; then
                fetch_code=1
                break
              fi
              echo $fetch_pr_result
              git branch -vv
              echo "git merge-base -a pr-branch HEAD"
              common_base_commit=$(git merge-base -a pr-branch HEAD || true)
              if [ "$common_base_commit"X == ""X ]; then
                code_base_check=1
                break
              fi
              echo "git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT)"
              set +e
              cp_pr_result=$(git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT) >> $cp_log 2>&1)
              cp_pr_code=$?
              if [ $cp_pr_code -ne 0 ]; then
                cp_code=1
                break
              fi
              echo $cp_pr_result
              cd -
              ~/bin/repo sync -c -d --no-tags -j12
              if [ $? -ne 0 ]; then
                repo_sync_code=1
                break
              fi
            else
              manifest_content=$(cat ".repo/manifests/$SNAPSHOT_FILE")
              #echo $manifest_content
              REPO_NAME=$(cat ".repo/manifests/$SNAPSHOT_FILE" | grep "\"$PROJECT_NAME\"" | awk -F'name="' '{print $2}' | awk -F'"' '{print $1}')
              if [ "$REPO_NAME"X == ""X ]; then
                repo_exist=1
                break
              fi
              REPO_PATH=$(cat ".repo/manifests/$SNAPSHOT_FILE" | grep "\"$PROJECT_NAME\"" | awk -F'path="' '{print $2}' | awk -F'"' '{print $1}')
              if [ "$REPO_PATH"X == ""X ]; then
                REPO_PATH=$REPO_NAME
              fi
              echo $REPO_PATH
              cd $REPO_PATH
              echo "git fetch openvela pull/$PR_NUMBER/head:pr-branch"
              fetch_pr_result=$(git fetch openvela pull/$PR_NUMBER/head:pr-branch >> $fetch_log 2>&1)
              fetch_pr_code=$?
              if [ $fetch_pr_code -ne 0 ]; then
                fetch_code=1
                break
              fi
              echo $fetch_pr_result
              git branch -vv
              echo "git merge-base -a pr-branch HEAD"
              common_base_commit=$(git merge-base -a pr-branch HEAD || true)
              if [ "$common_base_commit"X == ""X ]; then
                code_base_check=1
                break
              fi
              echo "git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT)"
              set +e
              cp_pr_result=$(git cherry-pick $(git rev-list --reverse HEAD..$PR_COMMIT) >> $cp_log 2>&1)
              cp_pr_code=$?
              if [ $cp_pr_code -ne 0 ]; then
                cp_code=1
                break
              fi
              echo $cp_pr_result
              cd -
            fi
          done
          echo "REPO_EXIST=$repo_exist" >> $GITHUB_ENV
          echo "REPO_SYNC_CODE=$repo_sync_code" >> $GITHUB_ENV
          echo "FETCH_PR_CODE=$fetch_code" >> $GITHUB_ENV
          echo "CP_PR_CODE=$cp_code" >> $GITHUB_ENV
          echo "CODE_BASE_CHECK=$code_base_check" >> $GITHUB_ENV
        continue-on-error: true

      - name: check cherry-pick pr result
        run: |
          if [ -n "${REPO_SYNC_CODE}" ] && [ ${REPO_SYNC_CODE} != 0 ]; then
            echo "repo sync after cherry-pick manifest PR failed."
            exit 1
          else
            echo "repo sync after cherry-pick manifest PR success."
          fi
          if [ -n "${REPO_EXIST}" ] && [ ${REPO_EXIST}X != 0X ]; then
            echo "repo is not exist, please check."
            exit 1
          fi
          if [ -n "${CODE_BASE_CHECK}" ] && [ ${CODE_BASE_CHECK}X != 0X ]; then
            echo "PR code base need to rebase with source repo."
            exit 1
          fi
          if [ ! -n "${FETCH_PR_CODE}" ] || ([ ${FETCH_PR_CODE}X == 0X ] && [ ${CP_PR_CODE}X == 0X ]) ; then
            echo "cherry-pick PR success and continue."
          else
            if [ ${FETCH_PR_CODE}X != 0X ]; then
              cat ${REPO_ROOT}/fetch.log
              echo "fetch PR failed"
              exit 1
            else
              cat ${REPO_ROOT}/cp.log | grep "is a merge"
              if [ $? -eq 0 ]; then
                echo "There's merge commit in your PR. Please use rebase insteadof merge."
                exit 1
              else
                cat ${REPO_ROOT}/cp.log
                echo "cherry-pick PR failed"
                exit 1
              fi
            fi
          fi

      - name: Move docker data to build volume
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker $GITHUB_WORKSPACE/docker
          sudo ln -s $GITHUB_WORKSPACE/docker /var/lib/docker
          sudo systemctl start docker

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Pull
        run: |
          docker pull ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx
          df -h

      - name: Clean up disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /etc/mysql /etc/php /opt/hostedtoolcache/CodeQL
          sudo docker builder prune -a 2>/dev/null || true
          sudo -E apt-get -y purge azure-cli* ghc* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* openjdk* adoptopenjdk* mysql* php* mongodb* moby* snap* || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          df -h

      - name: Use Apache xPack RISC-V toolchain for rv64
        if: ${{ matrix.group == 'ntfc-rv64' }}
        env:
          CI_WORKSPACE: ${{ github.workspace }}
        run: |
          set -e
          cd "${CI_WORKSPACE}"
          docker run --rm -v "${CI_WORKSPACE}":/workspace -w /workspace \
            ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
            /bin/bash -c '
              set -e
              tc=/workspace/prebuilts/gcc/linux-x86_64/riscv-none-elf
              echo "=== image toolchain ==="
              riscv-none-elf-gcc --version | head -2
              echo "=== manifest toolchain ==="
              "$tc/bin/riscv-none-elf-gcc" --version | head -2
              mv "$tc" "$tc.manifest"
              ln -s /tools/riscv-none-elf-gcc "$tc"
              "$tc/bin/riscv-none-elf-gcc" --version | head -1 | grep -q "xPack"
            '

      - name: Run CI tasks inside Docker container
        env:
          CI_WORKSPACE: ${{ github.workspace }}
          CI_MATRIX_GROUP: ${{ matrix.group }}
          CI_TRIGGER_REPO: ${{ needs.setup.outputs.TRIGGER_REPO_NAME }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_TASKS: ${{ join(matrix.tasks, ' ') }}
        run: |
          artifacts=[]
          for task in ${CI_TASKS}; do
            rm -rf output || true
            cmake_flag=""
            cp_base_dir="nuttx"
            task_flags=""
            run_ntfc=0
            echo "=== Starting task: $task ==="
            if [[ "$task" == *@* ]]; then
              task_flags="${task#*@}"
              task=$(echo "$task" | awk -F '@' '{print $1}')
            fi
            if [[ "@${task_flags}@" == *"@cmake@"* ]]; then
              cmake_flag="--cmake"
              cp_base_dir="cmake_out/*"
            fi
            if [[ "@${task_flags}@" == *"@ntfc@"* ]]; then
              run_ntfc=1
            fi
            if [[ "$task" == *:* ]] || [[ "$task" == *vendor/* ]]; then
              build_cmd="./build.sh $task $cmake_flag -e -Werror -j8"
            else
              build_cmd="./build.sh vendor/openvela/boards/vela/configs/$task $cmake_flag -e -Werror -j8"
            fi
            echo $build_cmd

            docker run --rm \
              -v "${CI_WORKSPACE}":/workspace \
              -w /workspace \
              ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
              /bin/bash -c "pwd && touch $task && df -h && ls -atl && $build_cmd && ls -atl nuttx"

            echo "=== Backup CI results for $task ==="
            ci_artifact_name="${CI_MATRIX_GROUP}/${task//:/_}_${CI_TRIGGER_REPO}-${CI_PR_NUMBER}"
            echo $ci_artifact_name
            mkdir -p $ci_artifact_name || true
            pwd
            ls -atl .
            if [[ "$task" == *:* ]] || [[ "$task" == *vendor/* ]]; then
              cp ${cp_base_dir}/nuttx ${cp_base_dir}/.config $ci_artifact_name
            else
              cp ${cp_base_dir}/nuttx ${cp_base_dir}/.config $ci_artifact_name
              # vela_*.bin is optional: only produced by full-image configs
              # (e.g. goldfish). Configs like qemu-* only produce nuttx ELF.
              cp ${cp_base_dir}/vela_*.bin $ci_artifact_name 2>/dev/null || true
            fi

            echo "=== Cleaning up after $task ==="
            sudo ~/bin/repo forall -v -c 'git clean -dfx; git reset --hard HEAD'  > /dev/null 2>&1 || true
            sudo rm -rf cmake_out || true

            if [[ "$task" == *-citest ]]; then
              echo "Run autotest tasks: $task"
              STANDARD_CONFIG="${task%-citest*}"
              test_model=${STANDARD_CONFIG//-/_}
              echo "pytest -m \"common or $test_model\" ./ -B $STANDARD_CONFIG -L /workspace -P /workspace -F /tmp -R qemu -v --disable-warnings --count=1 --json=/workspace/autotest.json --maxfail=10"
              docker run --rm \
                -v "${CI_WORKSPACE}":/workspace \
                -w /workspace \
                ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
                /bin/bash -c "free -m && df -h && cp $ci_artifact_name/* nuttx/ && ls -atl nuttx && cd tests/scripts/script && pytest -m \"common or $test_model\" ./ -B $STANDARD_CONFIG -L /workspace -P /workspace -F /tmp -R qemu -v --disable-warnings --count=1 --json=/workspace/autotest.json --maxfail=10"
                /bin/bash -c "ls -atl"

              echo "Check autotest result: $task"
              cd "${CI_WORKSPACE}"
              mkdir output
              cp ./*.log ./autotest.json $ci_artifact_name
              failed=$(cat autotest.json | jq '.report.summary.failed')
              if [ "$failed" != "null" ] && [ "$failed" != "0" ]; then
                echo "autotest failed: $failed"
                result="failed"
                exit 1;
              else
                echo "autotest passed"
                result="success"
              fi
            fi

            if [ "$run_ntfc" -eq 1 ]; then
              # Hand off to the separately bounded runtime step below.
              echo "NTFC_TASK=$task" >> $GITHUB_ENV
              echo "NTFC_ARTIFACT=$ci_artifact_name" >> $GITHUB_ENV
            fi
          done

      # Own step, own timeout: a step timeout is an ordinary step failure, so the
      # collection and upload below stay reachable. A job timeout is reported as
      # cancelled, under which the Archive condition evaluates false.
      - name: Write repro script
        if: ${{ startsWith(matrix.group, 'ntfc') }}
        run: |
          cat > "${{ github.workspace }}/repro.py" <<'REPRO_EOF'
          #!/usr/bin/env python3
          """Run ostest on qemu-armv8a:citest_smp repeatedly and dump every thread
          with gdb when it stops producing output.

          Verification only.  Usage: repro.py <nuttx-elf> <outdir> <iterations>
          """

          import os
          import select
          import subprocess
          import sys
          import time

          ELF, OUT, ITER = sys.argv[1], sys.argv[2], int(sys.argv[3])
          IDLE = int(os.environ.get("REPRO_IDLE", "90"))      # s without output = hang
          BOOT = int(os.environ.get("REPRO_BOOT", "120"))     # s to reach the prompt
          RUN = int(os.environ.get("REPRO_RUN", "900"))       # s for a whole ostest
          PORT = int(os.environ.get("REPRO_GDBPORT", "1234"))
          NUTTX = os.environ.get("REPRO_NUTTX", "/workspace/nuttx")

          QEMU = [
              "qemu-system-aarch64", "-cpu", "cortex-a53", "-smp", "4",
              "-machine", "virt,virtualization=on,gic-version=3",
              "-net", "none", "-nographic", "-kernel", ELF,
              "-gdb", f"tcp::{PORT}",
          ]

          GDB_CMDS = [
              "set pagination off", "set confirm off",
              f"target remote :{PORT}",
              "info threads", "thread apply all bt",
              f"source {NUTTX}/tools/pynuttx/gdbinit.py",
              "ps", "info nxthreads", "nxthread apply all bt full",
              "p g_running_tasks", "p g_readytorun", "p g_waitingforsemaphore",
              "p g_waitingforsignal", "p *g_pidhash@g_npidhash",
              "detach",
          ]


          def log(msg):
              print(msg, flush=True)


          def read_until(proc, buf, want, timeout, idle):
              """Read qemu stdout until `want` appears.  Returns (status, buf)."""
              end = time.time() + timeout
              last = time.time()
              fd = proc.stdout.fileno()
              while True:
                  now = time.time()
                  if want is not None and want in buf[-4096:]:
                      return "ok", buf
                  if now > end:
                      return "timeout", buf
                  if now - last > idle:
                      return "hang", buf
                  r, _, _ = select.select([fd], [], [], 1)
                  if r:
                      chunk = os.read(fd, 65536)
                      if not chunk:
                          return "eof", buf
                      buf += chunk.decode("utf-8", "replace")
                      last = time.time()


          def dump_gdb(path):
              args = ["gdb-multiarch", "-q", "-batch", "-nx"]
              for c in GDB_CMDS:
                  args += ["-ex", c]
              with open(path, "w") as f:
                  subprocess.run(args + [ELF], stdout=f, stderr=subprocess.STDOUT,
                                 timeout=900)
              # raw RAM for offline analysis (virt RAM base 0x40000000, 128M)
              ram = path.replace("-gdb.txt", "-ram.bin")
              subprocess.run(["gdb-multiarch", "-q", "-batch", "-nx",
                              "-ex", f"target remote :{PORT}",
                              "-ex", f"dump binary memory {ram} 0x40000000 0x48000000",
                              "-ex", "detach", ELF],
                             stdout=subprocess.DEVNULL, stderr=subprocess.STDOUT,
                             timeout=900)
              subprocess.run(["gzip", "-1", ram])


          def main():
              os.makedirs(OUT, exist_ok=True)
              summary = []
              for i in range(1, ITER + 1):
                  proc = subprocess.Popen(QEMU, stdin=subprocess.PIPE,
                                          stdout=subprocess.PIPE,
                                          stderr=subprocess.STDOUT)
                  buf = ""
                  st, buf = read_until(proc, buf, "nsh> ", BOOT, BOOT)
                  if st != "ok":
                      result = f"boot-{st}"
                  else:
                      proc.stdin.write(b"ostest\n")
                      proc.stdin.flush()
                      st, buf = read_until(proc, buf, "ostest_main: Exiting with status",
                                           RUN, IDLE)
                      if st == "ok":
                          result = "pass"
                          st, buf = read_until(proc, buf, "nsh> ", 30, 30)
                      else:
                          result = st
                  tail = "\n".join(buf.splitlines()[-3:])
                  log(f"[{i}/{ITER}] {result} | {tail!r}")
                  con = os.path.join(OUT, f"iter{i:03d}-{result}.console.txt")
                  if result != "pass":
                      with open(con, "w") as f:
                          f.write(buf)
                  if result in ("hang", "timeout"):
                      dump = os.path.join(OUT, f"iter{i:03d}-gdb.txt")
                      log(f"    dumping threads to {dump}")
                      try:
                          dump_gdb(dump)
                      except Exception as e:      # keep going on gdb trouble
                          log(f"    gdb failed: {e}")
                  proc.kill()
                  proc.wait()
                  summary.append(result)
                  if result in ("hang", "timeout") and os.environ.get("REPRO_STOP"):
                      break
              counts = {k: summary.count(k) for k in sorted(set(summary))}
              log(f"SUMMARY {counts}")
              with open(os.path.join(OUT, "summary.txt"), "w") as f:
                  f.write(f"{counts}\n" + "\n".join(summary) + "\n")


          if __name__ == "__main__":
              main()
          REPRO_EOF

      - name: Run NTFC runtime tests
        if: ${{ startsWith(matrix.group, 'ntfc') }}
        timeout-minutes: 300
        env:
          CI_WORKSPACE: ${{ github.workspace }}
        run: |
          set -e
          cd "${CI_WORKSPACE}"
          out="${NTFC_ARTIFACT}/repro"
          mkdir -p "$out"
          cp repro.py "$out/"
          cp "${NTFC_ARTIFACT}/nuttx" "$out/nuttx.elf"
          cp "${NTFC_ARTIFACT}/.config" "$out/config.txt"
          grep -E '^CONFIG_(STDIO_LINEBUFFER|STDIO_BUFFER_SIZE|SMP_NCPUS|SCHED_TICKLESS|TESTING_OSTEST)' "$out/config.txt" || true
          docker run --rm \
            -v "${CI_WORKSPACE}":/workspace -w /workspace \
            -e REPRO_STOP=1 \
            ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
            /bin/bash -c "set -e && \
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gdb-multiarch >/dev/null && \
              python3 -m pip install -q construct pyelftools cxxfilt lief==0.16.5 && \
              gdb-multiarch --version | head -1 && qemu-system-aarch64 --version | head -1 && \
              python3 /workspace/repro.py /workspace/${out}/nuttx.elf /workspace/${out} 25"
          cat "$out/summary.txt"

      # run.sh only moves its results after ntfc test returns, so a timeout
      # leaves them in nuttx/, outside the uploaded directory. Runs on any
      # outcome so the named container is always removed. Whenever run.sh did
      # run to completion it has already moved result and deleted
      # pytest.debug.log itself, so there is nothing left to find.
      - name: Collect NTFC diagnostics
        if: ${{ always() && startsWith(matrix.group, 'ntfc') }}
        env:
          CI_WORKSPACE: ${{ github.workspace }}
          NTFC_CONTAINER: ntfc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "${NTFC_CONTAINER}" 2>/dev/null || true
          cd "${CI_WORKSPACE}"
          [ -n "${NTFC_ARTIFACT:-}" ] || exit 0
          dest="${NTFC_ARTIFACT}/ntfc"
          mkdir -p "$dest"
          [ -d nuttx/result ] && sudo mv nuttx/result "$dest/"
          [ -f nuttx/pytest.debug.log ] && sudo mv nuttx/pytest.debug.log "$dest/"
          sudo chown -R "$(id -u):$(id -g)" "$dest"
          echo "collected $(find "$dest" -type f | wc -l) file(s)"

      # Unchanged for the other groups: upload on success only. ntfc also
      # uploads on failure, which is when its diagnostics are needed.
      - name: Archive CI Build Package
        if: ${{ success() || (!cancelled() && startsWith(matrix.group, 'ntfc')) }}
        uses: actions/upload-artifact@v4
        with:
          name: Build_Package_${{ matrix.group }}
          path: |
            ${{ matrix.group }}

  # Post-processing job to update dependent PR statuses.
  # Uses needs.ci-tasks.result to aggregate results across all matrix
  # groups: it is "success" only when every matrix instance succeeds;
  # any failure or cancellation in any group makes it "failure".
  post-processing:
    needs: [setup, ci-tasks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Post Processing
        env:
          CI_TASKS_STATUS: ${{ needs.ci-tasks.result }}
          DEPENDS_ON: ${{ needs.setup.outputs.DEPENDS_ON }}
          CURRENT_ACTION_URL: ${{ needs.setup.outputs.CURRENT_ACTION_URL }}
          CI_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Job status: ${CI_TASKS_STATUS}"

          if [[ "${CI_TASKS_STATUS}" == "success" ]]; then
            ci_status="success"
          else
            ci_status="failure"
          fi
          for DEPENDENCY in ${DEPENDS_ON}; do
            REPO_NAME=$(echo $DEPENDENCY | awk -F'/pull/' '{print $1}')
            PR_NUMBER=$(echo $DEPENDENCY | awk -F'/pull/' '{print $2}')
            PR_COMMITS=$(curl -s -H "Authorization: token ${CI_PAT}" "https://api.github.com/repos/$REPO_NAME/pulls/$PR_NUMBER")
            LATEST_SHA=$(echo "$PR_COMMITS" | jq -r '.head.sha')
            if [[ -z "$LATEST_SHA" ]]; then
              echo "No commits found for PR #$PR_NUMBER or invalid API response."
              exit 1
            fi
            set -x
            curl -X POST \
              -H "Authorization: token ${CI_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$REPO_NAME/statuses/$LATEST_SHA \
              -d '{
                "state": '"\"$ci_status\""',
                "description": "CI '"$ci_status"'",
                "context": "CI triggered by other PR",
                "target_url": "'"${CURRENT_ACTION_URL}"'"
              }'
            COMMENT_BODY="CI $ci_status. \n PR list is $ALL_PR.\n CI url: ${CURRENT_ACTION_URL}"
            curl -X POST \
              -H "Authorization: token ${CI_PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/$REPO_NAME/issues/$PR_NUMBER/comments \
              -d "{\"body\": \"$COMMENT_BODY\"}"
            set +x
          done

          # Propagate the aggregated ci-tasks status to this job so that a
          # single required status check on 'post-processing' is sufficient
          # to gate merges. Without this, the job would be green even when
          # any matrix instance failed, because status reporting was only
          # done via curl to dependent PRs.
          if [[ "$CI_TASKS_STATUS" != "success" ]]; then
            echo "::error::CI failed: needs.ci-tasks.result = $CI_TASKS_STATUS"
            exit 1
          fi
